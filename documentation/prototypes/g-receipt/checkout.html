<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CinemaBooking.Smart — Thanh toán (Biên nhận)</title>
<meta name="description" content="Hướng G — Biên nhận">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="home.html">CinemaBooking.Smart</a>
  <nav class="topnav">
    <a href="home.html">Trang chủ</a>
    <a href="movie.html">Phim</a>
    <a href="seatmap.html">Chỗ ngồi</a>
    <a href="checkout.html" aria-current="page">Thanh toán</a>
  </nav>
</header>

<main class="main">
  <h1 class="h1">Thanh toán</h1>
  <p class="lead">Biên nhận cuối — in ra, giữ làm kỷ niệm.</p>

  <section class="receipt">
    <div class="receipt__row receipt__row--head">
      <span>Mục</span><span></span><span>SL</span><span>Thành tiền</span>
    </div>
    <div class="receipt__row">
      <span>Vé xem phim</span><span></span><span>1</span><span>95.000₫</span>
    </div>
    <div class="receipt__row">
      <span>Combo bắp nước</span><span></span><span>1</span><span>65.000₫</span>
    </div>
    <div class="receipt__row receipt__row--total">
      <span>Tổng cộng</span><span></span><span></span><span>160.000₫</span>
    </div>
  </section>

  <form class="form" onsubmit="return false">
    <label class="field">
      <span>Họ tên</span>
      <input type="text" placeholder="Nguyễn Văn A">
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" placeholder="you@example.com">
    </label>
    <div class="actions">
      <button class="btn btn--primary" type="submit">Xác nhận &amp; in biên nhận</button>
    </div>
  </form>
</main>

<script src="app.js"></script>
</body>
</html>
